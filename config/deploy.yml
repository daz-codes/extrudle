# Kamal 2 deploy. The defaults are the preview for Stu at stu.daz.codes, on the shared
# daz.codes Hetzner server (ARM, Helsinki) alongside reports.daz.codes and purple.daz.codes.
# For the real deploy on its own box, set DEPLOY_HOST and APP_HOST (and leave DEMO_SEEDS unset).
#
#   KAMAL_REGISTRY_PASSWORD  a GitHub token that can push to ghcr.io/daz-codes (as for the other apps)
#
# Everything else secret is in Rails credentials, unlocked by RAILS_MASTER_KEY.
<%
  preview = ENV["DEPLOY_HOST"].to_s.empty?
  server = ENV.fetch("DEPLOY_HOST", "157.180.83.205")
  host = ENV.fetch("APP_HOST", "stu.daz.codes")
%>

service: extrudle
image: daz-codes/extrudle

# The web server also runs Solid Queue. The SQLite databases live on the storage volume below.
servers:
  web:
    - <%= server %>

# kamal-proxy terminates SSL with a Let's Encrypt certificate for the host
# (production.rb has assume_ssl and force_ssl on) and only routes healthy containers.
proxy:
  ssl: true
  host: <%= host %>
  healthcheck:
    path: /up
    timeout: 5

registry:
  server: ghcr.io
  username: daz-codes
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
<% unless preview %>
    # Litestream backups to Cloudflare R2 (docs/backups.md). The real deploy only.
    - LITESTREAM_ACCESS_KEY_ID
    - LITESTREAM_SECRET_ACCESS_KEY
<% end %>
  clear:
    # The public host name: links in emails, and the only Host header the app answers.
    APP_HOST: <%= host %>
    # Run the Solid Queue supervisor inside Puma: one server, so no separate job container.
    SOLID_QUEUE_IN_PUMA: true
    # The preview gets the demo data (password in credentials: demo_password). Never on the real box.
    DEMO_SEEDS: <%= ENV.fetch("DEMO_SEEDS", preview.to_s) %>
    # Only approved computers can use the real system; the preview stays open to show people (PLAN.md §11 Q58).
    REQUIRE_APPROVED_COMPUTERS: <%= ENV.fetch("REQUIRE_APPROVED_COMPUTERS", (!preview).to_s) %>
<% unless preview %>
    # Litestream backups (docs/backups.md): the R2 bucket and its S3 endpoint.
    LITESTREAM_BUCKET: <%= ENV.fetch("LITESTREAM_BUCKET", "extrudle-backups") %>
    LITESTREAM_ENDPOINT: <%= ENV.fetch("LITESTREAM_ENDPOINT") { raise "Set LITESTREAM_ENDPOINT (https://<account>.r2.cloudflarestorage.com) for the real deploy" } %>
<% end %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Rotate logs rather than keeping them for ever with Docker's default json-file driver.
logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: 5

# SQLite databases (app, queue, cache, cable). On the real deploy Litestream
# streams the app database to Cloudflare R2 (docs/backups.md).
volumes:
  - "extrudle_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: arm64 # the daz.codes server and this Mac are both ARM
